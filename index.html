<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav</title>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.js"></script>
    <script type="application/javascript">
      $.ajaxPrefilter(function (options) {
        if (options.crossDomain && jQuery.support.cors) {
          var protocol =
            window.location.protocol === "http:" ? "http:" : "https:";
          options.url =
            protocol + "//cors-anywhere.herokuapp.com/" + options.url;
        }
      });

      let prefix = "https://cn.bing.com/";

      $.ajax({
        url: `${prefix}HPImageArchive.aspx?format=js&idx=0&n=1`,
        type: "get",
        cache: false,
        contentType: false,
        processData: false,
        success: function (data) {
          let fullImgUrl = `${prefix}${data["images"][0]["url"]}`;
          $("body").css({ background: `url("${fullImgUrl}") fixed` });
        },
        error: function (e) {
          console.error(e);
        },
      });
    </script>

    <style rel="stylesheet" type="text/css">
      #baseContainer {
        background-color: rgba(255, 255, 255, 0.4);
        padding: 1rem;
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        border-radius: 1rem;
        margin: 25px 48px;
        cursor: pointer;
      }

      #baseContainer:active {
        background-color: transparent;
      }

      #baseContainer img {
        width: 3.6rem;
        height: 3.6rem;
        border-radius: 0.65rem;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      #childContainer span {
        display: inline-block;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        white-space: nowrap;
        text-overflow: ellipsis;
        width: 17.5rem;
        overflow: hidden;
      }

      #childContainer {
        margin-left: 1rem;
        width: 17.5rem;
      }

      #title {
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
      }

      #url {
        color: rgba(255, 255, 255, 0.6);
        padding-top: 0.5rem;
      }

      #parent {
        display: flex;
        flex-wrap: wrap;
      }

      body {
        background-color: #242424;
      }
    </style>
